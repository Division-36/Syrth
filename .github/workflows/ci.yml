name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A superseded commit on a pull request is not worth any runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Linux first and deliberately: the exported C header is only compiled where a
    # compiler exists, so a Windows or macOS runner would skip the one test that
    # catches a broken export. That bug shipped in 1.0.0 for exactly this reason.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # xgboost's wheel links against OpenMP, which the macOS runner does not
      # ship. Without this the two ML test modules fail at collection with a
      # dlopen error rather than an assertion, which reads like a product defect
      # and is not one. Linux and Windows need nothing.
      - name: Install OpenMP on macOS
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,benchmark]"

      - name: Lint
        run: python -m ruff check syrth tests benchmarks tools

      - name: Test
        run: python -m pytest tests -q -o addopts=

      # A rules-only install must work with no numerical stack, and the C exporter
      # must import without numpy. This is the check that would have caught the
      # 1.0.0 packaging defect, so it runs on its own rather than inside a test
      # process that already has the dependency.
      - name: Rules-only install
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/rulesonly
          /tmp/rulesonly/bin/pip install --quiet .
          /tmp/rulesonly/bin/python -m syrth.classifier.export --help > /dev/null
          /tmp/rulesonly/bin/python -c "import numpy" 2>/dev/null && \
            { echo "numpy leaked into a rules-only install"; exit 1; } || true

  build:
    # The wheel and sdist are built from the tagged commit, once, so a release can
    # never carry an artefact that was produced from a different tree than the one
    # it was tagged from.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the tag matches the version
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c "
          import pathlib, re
          text = pathlib.Path('pyproject.toml').read_text()
          print(re.search(r'^version = \"([^\"]+)\"', text, re.M).group(1))
          ")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $tag does not match version $version in pyproject.toml"
            exit 1
          fi
          for f in syrth/__init__.py syrth/scan.py; do
            grep -q "__version__ = \"$version\"" "$f" || {
              echo "$f does not declare $version"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/