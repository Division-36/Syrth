name: publish

# Publishing is deliberately manual. A tag creates the release; pushing to PyPI is
# a separate, explicit act, because an uploaded distribution is effectively
# permanent -- a name cannot be reused once claimed, and a bad upload cannot be
# replaced in place.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the version being published, e.g. 1.0.2"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing; no long-lived token in this repo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the confirmed version matches the tree
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c "
          import pathlib, re
          text = pathlib.Path('pyproject.toml').read_text()
          print(re.search(r'^version = \"([^\"]+)\"', text, re.M).group(1))
          ")
          if [ "$version" != "${{ github.event.inputs.confirm }}" ]; then
            echo "confirmed '${{ github.event.inputs.confirm }}' but pyproject.toml says $version"
            exit 1
          fi
          echo "publishing $version"

      - name: Refuse if the version already exists
        run: |
          set -euo pipefail
          version=$(python -c "
          import pathlib, re
          print(re.search(r'^version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))
          ")
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/syrth/$version/json")
          if [ "$code" = "200" ]; then
            echo "syrth $version is already on PyPI; bump the version instead of re-uploading"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the distribution installs and works
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          printf 'import os\ndef f(n):\n    return open(os.path.join("/srv", n))\n' > /tmp/a.py
          /tmp/check/bin/syrth --file /tmp/a.py | grep -q "CWE-22"
          /tmp/check/bin/python -m syrth.classifier.export --help > /dev/null
          echo "the built wheel scans and exports"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Skip the test job: it just ran against this tree, and PyPI's upload
          # bandwidth is better spent on the artefacts.
          skip-existing: false